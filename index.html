<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة الطلبات والردود - الآغا برو</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .header h2 { margin: 0; font-size: 1.3rem; color: var(--accent); }

        .status-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }

        .order-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 15px;
            border-right: 5px solid var(--accent);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: relative;
        }

        .order-card.new-order {
            border-right-color: var(--warning);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
            100% { box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .order-id { font-weight: bold; color: var(--accent); }
        .order-date { font-size: 0.75rem; color: var(--text-muted); }

        .delete-btn {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: none;
            padding: 5px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: 0.2s;
        }
        .delete-btn:hover { background: var(--danger); color: white; }

        .info-group { margin-bottom: 6px; font-size: 0.9rem; }
        .info-label { color: var(--text-muted); }

        .items-list {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: bold;
        }

        .reply-section {
            margin-top: 15px;
            border-top: 1px solid #334155;
            padding-top: 12px;
        }

        .reply-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .reply-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .reply-btn {
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: white;
        }

        .reply-btn:hover { opacity: 0.85; transform: translateY(-2px); }

        .btn-add { background-color: var(--success); }
        .btn-none { background-color: var(--danger); }
        .btn-err { background-color: var(--warning); color: #000; }
        .btn-custom { background-color: var(--accent); color: #000; grid-column: span 2; }

        .custom-msg-box {
            display: none;
            margin-top: 10px;
        }

        .custom-msg-box input {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            margin-bottom: 6px;
            font-family: inherit;
        }

        .custom-msg-box button {
            width: 100%;
            padding: 8px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .current-reply {
            margin-top: 10px;
            padding: 8px;
            background: rgba(56, 189, 248, 0.1);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--accent);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>📦 لوحة إدارة الطلبات والردود - الآغا برو</h2>
        <span class="status-badge" id="live-status">مباشر 🟢</span>
    </div>

    <div class="orders-grid" id="ordersContainer">
        <p style="text-align:center; grid-column: 1/-1;">جاري تحميل الطلبات...</p>
    </div>

    <script>
        const ADMIN_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzrb_C-g6l3HouHcj45LahD0I_YLrUoaIYTMLzcE5HuQI7SWNugwQntUycC7pZjAWP9uQ/exec";

        let previousOrderCount = 0;
        let isFirstLoad = true;
        let activeCustomInputId = null; // الاحتفاظ بمعرف الحقل النشط أثناء الكتابة

        function playAlertSound() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = "sine";
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.3);
        }

        async function fetchOrders() {
            try {
                const response = await fetch(ADMIN_SCRIPT_URL);
                const orders = await response.json();
                
                if (orders.length > previousOrderCount && !isFirstLoad) {
                    playAlertSound();
                }
                
                previousOrderCount = orders.length;
                isFirstLoad = false;
                renderOrders(orders);
            } catch (err) {
                console.error("خطأ في جلب الطلبات:", err);
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');
            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">لا توجد طلبات حتى الآن.</p>';
                return;
            }

            // التقاط النص المكتوب وحالة العرض لصندوق الرسالة الخاصة النشط حالياً لئلا يختفي عند التحديث
            let currentInputValue = "";
            let customBoxDisplay = "none";
            if (activeCustomInputId) {
                const activeInput = document.getElementById(`input_${activeCustomInputId}`);
                const activeBox = document.getElementById(`customBox_${activeCustomInputId}`);
                if (activeInput) currentInputValue = activeInput.value;
                if (activeBox) customBoxDisplay = activeBox.style.display;
            }

            container.innerHTML = orders.map(order => `
                <div class="order-card ${order.status === 'قيد المراجعة' ? 'new-order' : ''}">
                    <div class="order-header">
                        <span class="order-id">${order.id}</span>
                        <span class="order-date">${order.date}</span>
                        <button class="delete-btn" onclick="deleteOrder('${order.id}')"><i class="fa-solid fa-trash"></i> حذف</button>
                    </div>
                    <div class="info-group"><span class="info-label">الزبون:</span> ${order.name}</div>
                    <div class="info-group"><span class="info-label">الهاتف:</span> <a href="tel:${order.phone}" style="color:var(--accent);">${order.phone}</a></div>
                    <div class="info-group"><span class="info-label">العنوان/المحل:</span> ${order.address}</div>
                    
                    <div class="items-list">
                        ${order.items.map(item => `<div>${item.name}</div>`).join('')}
                    </div>

                    ${order.reply ? `<div class="current-reply">الرد الحالي: <strong>${order.reply}</strong></div>` : ''}

                    <div class="reply-section">
                        <div class="reply-title">إرسال رد للزبون:</div>
                        <div class="reply-btn-group">
                            <button class="reply-btn btn-add" onclick="sendReply('${order.id}', 'تم الإضافة', 'مكتمل')"><i class="fa-solid fa-check-circle"></i> تم الإضافة</button>
                            <button class="reply-btn btn-none" onclick="sendReply('${order.id}', 'لا يوجد توافق', 'ملغي')"><i class="fa-solid fa-times-circle"></i> لا يوجد توافق</button>
                            <button class="reply-btn btn-err" onclick="sendReply('${order.id}', 'حدث خطأ في الاتصال', 'خطأ')"><i class="fa-solid fa-exclamation-triangle"></i> خطأ اتصال</button>
                            <button class="reply-btn btn-custom" onclick="toggleCustomBox('${order.id}')"><i class="fa-solid fa-pen"></i> رسالة خاصة</button>
                        </div>

                        <div class="custom-msg-box" id="customBox_${order.id}" style="display: ${activeCustomInputId === order.id ? customBoxDisplay : 'none'};">
                            <input type="text" id="input_${order.id}" placeholder="اكتب ردك الخاص هنا..." 
                                   onfocus="activeCustomInputId='${order.id}'" 
                                   value="${activeCustomInputId === order.id ? currentInputValue : ''}">
                            <button onclick="sendCustomReply('${order.id}')">إرسال الرد الخاص</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleCustomBox(orderId) {
            const box = document.getElementById(`customBox_${orderId}`);
            if (box.style.display === 'block') {
                box.style.display = 'none';
                activeCustomInputId = null;
            } else {
                box.style.display = 'block';
                activeCustomInputId = orderId;
            }
        }

        async function sendCustomReply(orderId) {
            const input = document.getElementById(`input_${orderId}`);
            const msg = input.value.trim();
            if (!msg) {
                alert("يرجى كتابة نص الرسالة أولاً!");
                return;
            }
            activeCustomInputId = null;
            await sendReply(orderId, msg, 'مكتمل');
        }

        async function sendReply(orderId, replyText, statusText) {
            try {
                await fetch(ADMIN_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'sendReply',
                        orderId: orderId,
                        replyMessage: replyText,
                        newStatus: statusText
                    })
                });
                activeCustomInputId = null;
                alert("تم إرسال الرد بنجاح!");
                fetchOrders();
            } catch (err) {
                alert("حدث خطأ أثناء إرسال الرد");
            }
        }

        async function deleteOrder(orderId) {
            if (!confirm("هل أنت متأكد من حذف هذا الطلب نهائياً؟")) return;
            try {
                await fetch(ADMIN_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'deleteOrder',
                        orderId: orderId
                    })
                });
                fetchOrders();
            } catch (err) {
                alert("حدث خطأ أثناء حذف الطلب");
            }
        }

        fetchOrders();
        setInterval(fetchOrders, 5000);
    </script>
</body>
</html>
