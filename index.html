<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
<title>الآغا برو - التوافق الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --primary: #0052d4;
    --secondary: #4364f7;
    --accent: #6fb1fc;
    --vibrant-gradient: linear-gradient(135deg, #0052d4 0%, #4364f7 50%, #6fb1fc 100%);
    --bg-color: #f8fafc;
    --card-white: #ffffff;
    --text-dark: #0f172a;
    --text-light: #475569;
    --radius-lg: 20px;
    --radius-md: 15px;
    --shadow-premium: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  }

  /* منع تحديد النصوص في كامل الصفحة */
  * { 
    margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; 
    user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
  }

  body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background-color: var(--bg-color);
    background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 82, 212, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(111, 177, 252, 0.05) 0%, transparent 40%);
    min-height: 100vh;
    color: var(--text-dark);
  }

  /* هيدر قوي الألوان */
  header { 
    background: var(--vibrant-gradient);
    padding: 3.5rem 1rem 5rem; 
    text-align: center; 
    color: white; 
    border-radius: 0 0 40px 40px; 
    box-shadow: 0 10px 30px rgba(0, 82, 212, 0.3);
    position: relative;
    z-index: 1;
  }

  header h1 { 
    font-size: 2.6rem; font-family: 'Changa', sans-serif; 
    margin: 0; text-shadow: 2px 4px 6px rgba(0,0,0,0.15);
  }

  header p { opacity: 0.95; font-weight: 400; font-size: 1.1rem; margin-top: 5px; letter-spacing: 0.5px; }

  .lang-switcher {
    position: absolute; top: 20px; right: 20px;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(10px);
    color: white; border: 1.5px solid rgba(255,255,255,0.4);
    padding: 7px 16px; border-radius: 12px; cursor: pointer;
    font-weight: 700; font-size: 0.9rem; transition: 0.3s;
  }
  .lang-switcher:hover { background: white; color: var(--primary); }

  .container { max-width: 600px; margin: -35px auto 40px; padding: 0 20px; position: relative; z-index: 10; }

  /* انيميشن الدخول الواضح */
  .step-view { display: none; }
  .step-view.active { 
    display: block; 
    animation: entrance 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; 
  }

  @keyframes entrance {
    from { opacity: 0; transform: translateY(30px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .step-title { 
    text-align: center; margin-bottom: 20px; color: var(--text-dark); 
    font-weight: 700; font-size: 1.25rem; 
    background: var(--card-white); padding: 15px; border-radius: var(--radius-md);
    box-shadow: var(--shadow-premium);
    border-bottom: 3px solid var(--primary);
  }

  /* شبكة العناصر */
  .grid-menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
  
  .grid-item { 
    background: var(--card-white); 
    border-radius: var(--radius-lg); 
    padding: 22px 10px; 
    text-align: center; cursor: pointer; 
    transition: all 0.3s ease;
    border: 1px solid #e2e8f0;
    display: flex; flex-direction: column; align-items: center;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  }
  
  .grid-item:hover { 
    transform: translateY(-8px); 
    border-color: var(--primary);
    box-shadow: 0 15px 30px rgba(0, 82, 212, 0.15);
  }
  
  .grid-item img { 
    width: 60px; height: 60px; object-fit: contain; margin-bottom: 12px; 
    transition: 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  }
  .grid-item:hover img { transform: scale(1.15); }
  .grid-item span { font-size: 1.05rem; font-weight: 700; color: var(--text-dark); }

  /* الأزرار والبحث */
  .back-btn {
    background: var(--card-white); border: 2px solid #e2e8f0; padding: 10px 18px; 
    border-radius: 12px; cursor: pointer; font-weight: 700; margin-bottom: 15px; 
    display: inline-flex; align-items: center; gap: 8px; color: var(--text-light);
    transition: 0.3s;
  }
  .back-btn:hover { border-color: var(--primary); color: var(--primary); transform: translateX(5px); }

  #searchInput {
    width: 100%; padding: 18px 25px; border: 2px solid #e2e8f0; 
    border-radius: 15px; font-size: 1rem; margin-bottom: 20px; 
    box-sizing: border-box; outline: none; transition: 0.3s;
    box-shadow: var(--shadow-premium); font-weight: 500;
    user-select: text !important; -webkit-user-select: text !important; /* السماح بالكتابة داخل البحث */
  }
  #searchInput:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0, 82, 212, 0.1); }

  /* قائمة النتائج بجودة عالية */
  #productsList { 
    background: var(--card-white); border-radius: var(--radius-lg); 
    max-height: 480px; overflow-y: auto;
    box-shadow: var(--shadow-premium);
    border: 1px solid #e2e8f0;
  }
  
  .item { 
    padding: 18px 20px; border-bottom: 1px solid #f1f5f9; 
    display: flex; justify-content: space-between; align-items: center;
    transition: 0.2s;
  }
  .item:last-child { border-bottom: none; }
  .item:hover { background: #f8fafc; transform: scale(1.01); }
  
  .item.matched { 
    background: #eff6ff; 
    border-right: 5px solid var(--primary); 
  }
  
  .item .name { font-weight: 700; color: var(--text-dark); }
  .item .compatibility { 
    background: var(--primary); color: white; 
    padding: 6px 14px; border-radius: 10px; 
    font-size: 0.9rem; font-weight: 700; 
    box-shadow: 0 4px 8px rgba(0, 82, 212, 0.2);
  }

  footer { text-align: center; padding: 2.5rem 1rem; color: var(--text-light); font-weight: 600; font-size: 0.9rem; }

  /* شريط التمرير الملون */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
</style>
</head>
<body oncontextmenu="return false;"> <button class="lang-switcher" id="langBtn" onclick="toggleLang()">EN</button>

<header>
  <h1 id="appTitle">الآغا برو</h1>
  <p id="appSubtitle">دليل التوافقات الذكي</p>
</header>

<main class="container">
  <div id="step-brands" class="step-view active">
    <div class="step-title" id="titleStep1"><i class="fa-solid fa-mobile-screen-button"></i> اختر الشركة المصنعة</div>
    <div class="grid-menu" id="brandsGrid"></div>
  </div>

  <div id="step-types" class="step-view">
    <button class="back-btn" onclick="showStep('brands')"><i class="fa-solid fa-chevron-right"></i> <span id="backText1">عودة</span></button>
    <div class="step-title" id="selectedBrandTitle"></div>
    <div class="grid-menu" id="typesGrid"></div>
  </div>

  <div id="step-results" class="step-view">
    <button class="back-btn" onclick="showStep('types')"><i class="fa-solid fa-chevron-right"></i> <span id="backText2">عودة</span></button>
    <div style="position:relative; overflow: visible;">
        <input type="text" id="searchInput" oninput="renderList()">
        <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:20px; top:20px; color:var(--primary); font-size: 1.2rem;"></i>
    </div>
    <div id="productsList"></div>
  </div>
</main>

<footer><span id="footerText">جميع الحقوق محفوظة © الآغا برو 2026</span></footer>

<script>
  // منع الاختصارات (نسخ، قص، عرض كود المصدر)
  document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'u' || e.key === 'a' || e.key === 's')) {
      e.preventDefault();
      return false;
    }
  });

  const apiUrl = "https://script.google.com/macros/s/AKfycbzG8ppzM1qIVFSjUp7FfRMYL9vQbH1cIgHUceaIDQgK1yh7Pir_rbFHYREJ8Qgl3ONDvA/exec";
  let allData = [];
  let selectedBrand = ""; 
  let selectedType = "";
  let currentLang = 'ar';

  const DB_BRANDS = [
    { ar: "ايفون", en: "iPhone", img: "https://h.top4top.io/p_36990v39l0.jpg" },
    { ar: "سامسونج", en: "Samsung", img: "https://b.top4top.io/p_3699ftzh80.jpeg" },
    { ar: "شاومي", en: "Xiaomi", img: "https://e.top4top.io/p_3699zoev12.png" },
    { ar: "هواوي", en: "Huawei", img: "https://b.top4top.io/p_3699f74m40.png" },
    { ar: "هونر", en: "Honor", img: "https://h.top4top.io/p_3699rooyv8.jpeg" },
    { ar: "اوبو", en: "Oppo", img: "https://b.top4top.io/p_3699vi4kc1.jpg" },
    { ar: "فيفو", en: "Vivo", img: "https://g.top4top.io/p_3699nr78i0.png" },
    { ar: "انفنكس", en: "Infinix", img: "https://l.top4top.io/p_3699pwmr33.jpg" },
    { ar: "تكنو", en: "Tecno", img: "https://a.top4top.io/p_3699ns6wj0.png" },
    { ar: "ريلمي", en: "Realme", img: "https://e.top4top.io/p_36999axcs0.png" },
    { ar: "آيتل", en: "Itel", img: "https://h.top4top.io/p_3699dh6mj0.png" }
  ];

  const DB_TYPES = {
    ar: ["شاشات", "بطاريات", "گفرات", "فلاتات شحن", "ايسيات", "لواصق", "شرائط"],
    en: ["Screens", "Batteries", "Covers", "Charging Flex", "ICs", "Stickers", "Flex Cables"]
  };

  const UI_TEXT = {
    ar: { title: "الآغا برو", sub: "دليل التوافقات الذكي", step1: "اختر الشركة المصنعة", back: "عودة", search: "ابحث عن موديل أو توافق...", footer: "جميع الحقوق محفوظة © الآغا برو 2026", noResult: "لا توجد نتائج مطابقة.." },
    en: { title: "Al-Agha Pro", sub: "Smart Compatibility Guide", step1: "Select Brand", back: "Back", search: "Search model or compatibility...", footer: "All Rights Reserved © Al-Agha Pro 2026", noResult: "No results found.." }
  };

  window.onload = () => { updateUI(); fetchData(); };

  function toggleLang() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    document.getElementById('htmlTag').dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'EN' : 'AR';
    updateUI();
  }

  function updateUI() {
    const t = UI_TEXT[currentLang];
    document.getElementById('appTitle').innerText = t.title;
    document.getElementById('appSubtitle').innerText = t.sub;
    document.getElementById('titleStep1').innerHTML = `<i class="fa-solid fa-mobile-screen-button"></i> ${t.step1}`;
    document.getElementById('backText1').innerText = t.back;
    document.getElementById('backText2').innerText = t.back;
    document.getElementById('searchInput').placeholder = t.search;
    document.getElementById('footerText').innerText = t.footer;
    initGrids();
  }

  function initGrids() {
    const bGrid = document.getElementById('brandsGrid');
    bGrid.innerHTML = '';
    DB_BRANDS.forEach((b, i) => {
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.style.animationDelay = `${i * 0.04}s`;
      item.onclick = () => { selectedBrand = b.ar; document.getElementById('selectedBrandTitle').innerText = (currentLang==='ar'?b.ar:b.en); showStep('types'); };
      item.innerHTML = `<img src="${b.img}" onerror="this.src='https://img.icons8.com/ios/50/000000/smartphone.png'"><span>${currentLang==='ar'?b.ar:b.en}</span>`;
      bGrid.appendChild(item);
    });

    const tGrid = document.getElementById('typesGrid');
    tGrid.innerHTML = '';
    DB_TYPES[currentLang].forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.style.animationDelay = `${i * 0.04}s`;
      item.onclick = () => { selectedType = DB_TYPES['ar'][i]; showStep('results'); renderList(); };
      item.innerHTML = `<span>${t}</span>`;
      tGrid.appendChild(item);
    });
  }

  function showStep(s) {
    document.querySelectorAll('.step-view').forEach(v => v.classList.remove('active'));
    document.getElementById('step-' + s).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function fetchData() {
    try {
      const res = await fetch(apiUrl);
      allData = await res.json();
    } catch (e) { console.error("Error", e); }
  }

  function renderList() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const list = document.getElementById('productsList');
    list.innerHTML = '';

    const filtered = allData.slice(1).filter(row => {
      const bMatch = row[3].toString().trim() === selectedBrand;
      const tMatch = row[2].toString().trim() === selectedType;
      if (!bMatch || !tMatch) return false;
      if (query === "") return true;
      const model = row[0].toString().toLowerCase();
      const comp = row[1].toString().toLowerCase();
      return model.includes(query) || query.includes(model) || comp.includes(query);
    });

    if (filtered.length === 0) {
      list.innerHTML = `<div style="text-align:center; padding:50px; color:#94a3b8;"><i class="fa-solid fa-magnifying-glass fa-3x" style="margin-bottom:15px; opacity:0.3;"></i><br>${UI_TEXT[currentLang].noResult}</div>`;
      return;
    }

    filtered.forEach((row, i) => {
      const model = row[0].toString().toLowerCase();
      const div = document.createElement('div');
      div.className = 'item';
      div.style.animationDelay = `${i * 0.02}s`;
      if (query !== "" && (model.includes(query) || query.includes(model))) div.classList.add('matched');
      div.innerHTML = `<span class="name">${row[0]}</span><span class="compatibility">${row[1]}</span>`;
      list.appendChild(div);
    });
  }
</script>
</body>
</html>
