<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>الآغا برو - التوافق الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --main-gradient: linear-gradient(135deg, #0062ff 0%, #00d2ff 100%);
    --bg-color: #f0f4f8;
    --card-bg: rgba(255, 255, 255, 0.9);
    --text-main: #1a202c;
    --accent-glow: rgba(0, 98, 255, 0.2);
    --radius: 20px;
  }
  body {
    font-family: 'IBM Plex Sans Arabic', 'Changa', sans-serif;
    background: var(--bg-color);
    background-image: radial-gradient(at 0% 0%, rgba(0, 210, 255, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(0, 98, 255, 0.15) 0px, transparent 50%);
    margin: 0; min-height: 100vh; color: var(--text-main); display: flex; flex-direction: column; user-select: none;
  }
  #langOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--main-gradient); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; color: white; }
  .lang-init-btn { background: white; color: #0062ff; border: none; padding: 15px 40px; border-radius: 12px; margin: 10px; font-weight: 700; cursor: pointer; font-size: 1.2rem; width: 220px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
  .lang-switcher { position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.25); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 6px 15px; border-radius: 10px; cursor: pointer; font-weight: 700; z-index: 100; backdrop-filter: blur(10px); transition: 0.3s; }
  header { background: var(--main-gradient); padding: 4rem 1rem; text-align: center; color: white; border-radius: 0 0 50px 50px; box-shadow: 0 10px 30px var(--accent-glow); position: relative; overflow: hidden; }
  header h1 { font-size: 2.8rem; margin: 0; font-weight: 700; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }
  header p { opacity: 0.9; font-size: 1.1rem; margin-top: 10px; }
  main { flex: 1; padding: 2rem 1rem; }
  .container { max-width: 700px; margin: -60px auto 20px; background: var(--card-bg); backdrop-filter: blur(10px); border-radius: var(--radius); padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.5); }
  label { display: block; font-weight: 600; margin-bottom: 8px; color: #4a5568; font-size: 0.95rem; }
  select, input { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 1rem; margin-bottom: 20px; transition: all 0.3s ease; background: white; box-sizing: border-box; }

  /* الحل المطلوب: تحويل قائمة النتائج إلى صندوق تمرير (List Box) */
  #productsList { 
    max-height: 350px; 
    overflow-y: scroll; /* تمرير دائم عند الحاجة */
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 15px;
    padding: 10px;
    display: block;
  }
  
  /* تحسين مظهر شريط التمرير */
  #productsList::-webkit-scrollbar { width: 8px; }
  #productsList::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 10px; }

  .item { background: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #edf2f7; transition: 0.2s; }
  .item:last-child { margin-bottom: 0; }
  .item:hover { border-color: #0062ff; }
  .item .name { font-weight: 700; color: #2d3748; }
  .item .compatibility { background: #ebf4ff; color: #0062ff; padding: 6px 14px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; border: 1px solid rgba(0,98,255,0.1); }
  footer { text-align: center; padding: 2rem; color: #718096; font-size: 0.9rem; }
</style>
</head>
<body>

<div id="langOverlay">
  <h2 style="margin-bottom:20px;">اختر اللغة / Select Language</h2>
  <button class="lang-init-btn" onclick="setLanguage('ar')">العربية</button>
  <button class="lang-init-btn" onclick="setLanguage('en')">English</button>
</div>

<button class="lang-switcher" id="langToggle" onclick="toggleLang()">EN</button>

<header>
  <h1 id="txt-title">الآغا برو</h1>
  <p id="txt-subtitle">دليل الآغا للتوافقات الذكي</p>
</header>

<main>
  <div class="container" id="customerPage">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
      <div>
        <label id="lbl-brand">الشركة</label>
        <select id="brandSelect" onchange="onBrandOrTypeChange()">
          <option value="" disabled selected id="opt-brand-default">اختر</option>
        </select>
      </div>
      <div>
        <label id="lbl-type">القسم</label>
        <select id="typeSelect" onchange="onBrandOrTypeChange()" disabled>
          <option value="" disabled selected id="opt-type-default">اختر</option>
        </select>
      </div>
    </div>
    <input type="text" id="searchInput" placeholder="🔍 ابحث عن موديل الجهاز..." oninput="renderList()" style="display:none;">
    <div id="productsList"></div>
  </div>
</main>

<footer><span id="txt-footer">جميع الحقوق محفوظة © الآغا برو 2026</span></footer>

<script>
  const apiUrl = "https://script.google.com/macros/s/AKfycbzG8ppzM1qIVFSjUp7FfRMYL9vQbH1cIgHUceaIDQgK1yh7Pir_rbFHYREJ8Qgl3ONDvA/exec";
  let allData = [];
  let currentLang = 'ar';
  const DB_BRANDS = ["ايفون", "سامسونج", "شاومي", "هواوي", "هونر", "اوبو", "فيفو", "انفنكس", "تكنو", "ريلمي", "آيتل"];
  const DB_TYPES = ["شاشات", "بطاريات","گفرات","فلاتات شحن", "ايسيات", "لواصق", "شرائط"];

  const translations = {
    ar: { title: "الآغا برو", subtitle: "دليل الآغا للتوافقات الذكي", brand: "الشركة", type: "القسم", search: "🔍 ابحث عن موديل الجهاز...", select: "اختر", footer: "جميع الحقوق محفوظة © الآغا برو 2026", toggle: "EN", brands: DB_BRANDS, types: DB_TYPES },
    en: { title: "Al-Agha Pro", subtitle: "Smart Compatibility Guide", brand: "Brand", type: "Category", search: "🔍 Search device model...", select: "Select", footer: "All Rights Reserved © Al-Agha Pro 2026", toggle: "AR", brands: ["iPhone", "Samsung", "Xiaomi", "Huawei", "Honor", "Oppo", "Vivo", "Infinix", "Techno", "Realme", "Itel"], types: ["Screens", "Batteries","Covers" ,"Charging Flex", "ICs", "Stickers", "Flex Cables"] }
  };

  window.onload = function() {
    const savedLang = localStorage.getItem('appLang');
    if (savedLang) { setLanguage(savedLang); } else { document.getElementById('langOverlay').style.display = 'flex'; }
  };

  function setLanguage(lang) {
    currentLang = lang;
    localStorage.setItem('appLang', lang);
    document.getElementById('langOverlay').style.display = 'none';
    const isEn = lang === 'en';
    const t = translations[lang];
    document.getElementById('htmlTag').dir = isEn ? 'ltr' : 'rtl';
    document.getElementById('langToggle').innerText = t.toggle;
    document.getElementById('txt-title').innerText = t.title;
    document.getElementById('txt-subtitle').innerText = t.subtitle;
    document.getElementById('lbl-brand').innerText = t.brand;
    document.getElementById('lbl-type').innerText = t.type;
    document.getElementById('searchInput').placeholder = t.search;
    document.getElementById('opt-brand-default').innerText = t.select;
    document.getElementById('opt-type-default').innerText = t.select;
    document.getElementById('txt-footer').innerText = t.footer;
    fillSelect('brandSelect', t.brands, DB_BRANDS, t.select);
    fillSelect('typeSelect', t.types, DB_TYPES, t.select);
    fetchData();
  }

  function toggleLang() { setLanguage(currentLang === 'ar' ? 'en' : 'ar'); }

  function fillSelect(id, displayList, valueList, defaultTxt) {
    const el = document.getElementById(id);
    el.innerHTML = defaultTxt ? `<option value="" disabled selected>${defaultTxt}</option>` : '';
    displayList.forEach((text, i) => {
      const opt = document.createElement('option');
      opt.value = valueList[i]; opt.innerText = text; el.appendChild(opt);
    });
  }

  async function fetchData() {
    try {
      const res = await fetch(apiUrl);
      allData = await res.json();
      document.getElementById('typeSelect').disabled = false;
      renderList();
    } catch (e) { console.error("Error", e); }
  }

  function onBrandOrTypeChange() {
    if (document.getElementById('brandSelect').value && document.getElementById('typeSelect').value) {
      document.getElementById('searchInput').style.display = 'block';
      renderList();
    }
  }

  function renderList() {
    const brand = document.getElementById('brandSelect').value.toLowerCase();
    const type = document.getElementById('typeSelect').value.toLowerCase();
    const query = document.getElementById('searchInput').value.toLowerCase();
    const list = document.getElementById('productsList');
    list.innerHTML = '';
    const filtered = allData.slice(1).filter(row => {
      return row[3].toString().toLowerCase() === brand && row[2].toString().toLowerCase() === type && row[0].toString().toLowerCase().includes(query);
    });
    if (filtered.length === 0 && document.getElementById('typeSelect').value) {
        list.innerHTML = `<p style="text-align:center; color:#a0aec0; margin-top:20px;">${currentLang==='ar'?'لا توجد نتائج..':'No results found..'}</p>`;
        return;
    }
    filtered.forEach(row => {
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `<span class="name">${row[0]}</span><span class="compatibility">${row[1]}</span>`;
      list.appendChild(div);
    });
  }
</script>
</body>
</html>
